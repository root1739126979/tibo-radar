name: Tibo reset monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tibo-reset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Poll public Tibo signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIBO_RADAR_ASSIGNEE: ${{ vars.TIBO_RADAR_ASSIGNEE }}
        run: node src/cloud-monitor.js
