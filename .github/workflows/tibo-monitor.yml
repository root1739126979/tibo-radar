name: Tibo reset monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: false
        default: monitor
        type: choice
        options:
          - monitor
          - serverchan-smoke-test
      request_id:
        description: Correlation id for a smoke test
        required: false
        default: manual
        type: string

run-name: Tibo reset monitor / ${{ inputs.mode || 'monitor' }} / ${{ inputs.request_id || 'scheduled' }}

permissions:
  contents: read
  issues: write

concurrency:
  group: tibo-reset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Poll public Tibo signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIBO_RADAR_ASSIGNEE: ${{ vars.TIBO_RADAR_ASSIGNEE }}
          TIBO_RADAR_MODE: ${{ inputs.mode || 'monitor' }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SERVERCHAN_ENABLED_AT: ${{ vars.SERVERCHAN_ENABLED_AT }}
        run: node src/cloud-monitor.js
